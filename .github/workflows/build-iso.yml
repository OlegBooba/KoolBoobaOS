name: Build KoolBoobaOS ISO

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths:
      - "config/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build ISO (Debian + XFCE4, Windows 7 style)
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            syslinux-utils \
            squashfs-tools \
            isolinux \
            dosfstools \
            mtools \
            ca-certificates \
            wget \
            parted \
            qemu-utils

      - name: Show environment info
        run: |
          echo "live-build version:"
          lb --version || dpkg -l | grep live-build
          echo "Free space:"
          df -h /

      - name: Build KoolBoobaOS ISO
        run: |
          sudo bash ./build.sh
        env:
          LB_APT_INDICES: "false"

      - name: Verify ISO was created
        run: |
          ls -lh KoolBoobaOS-amd64.iso
          sha256sum KoolBoobaOS-amd64.iso | tee KoolBoobaOS-amd64.iso.sha256

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoolBoobaOS-ISO
          path: |
            KoolBoobaOS-amd64.iso
            KoolBoobaOS-amd64.iso.sha256
          retention-days: 14
          compression-level: 0

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
        continue-on-error: true

      - name: Create GitHub Release (on manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "KoolBoobaOS build #${{ github.run_number }}"
          body: |
            Автоматическая сборка KoolBoobaOS (Debian GNU/Linux + XFCE4, оформление под Windows 7).

            Как использовать:
            1. Скачайте KoolBoobaOS-amd64.iso
            2. Создайте новую ВМ в VirtualBox (тип: Linux, версия: Debian 64-bit)
            3. Подключите ISO как загрузочный диск
            4. Запустите ВМ — загрузится Live-система
            5. Для установки на диск используйте ярлык "Установить KoolBoobaOS" на рабочем столе
          files: |
            KoolBoobaOS-amd64.iso
            KoolBoobaOS-amd64.iso.sha256
          draft: false
          prerelease: false
